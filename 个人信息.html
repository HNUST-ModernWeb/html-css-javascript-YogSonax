<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>个人信息卡片</title>
    <style>
        /* 全局样式重置 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Microsoft YaHei", sans-serif;
        }

        /* 页面整体布局 */
        body {
            min-height: 100vh;
            background-color: #f0f2f5;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 40px 20px;
        }

        /* 页面标题 */
        .page-title {
            font-size: 28px;
            color: #333;
            margin-bottom: 30px;
            text-align: center;
        }

        /* 卡片容器样式 */
        .card {
            width: 100%;
            max-width: 400px;
            background-color: #fff;
            border-radius: 20px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.1);
            padding: 30px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
        }

        /* 头像区域 */
        .avatar-container {
            position: relative;
        }

        .avatar {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            object-fit: cover;
            border: 4px solid #4285f4;
            cursor: pointer;
            transition: transform 0.3s ease;
        }

        .avatar:hover {
            transform: scale(1.05);
        }

        /* 隐藏原生文件上传按钮 */
        #avatar-input {
            display: none;
        }

        /* 信息展示区域 */
        .info-display {
            text-align: center;
            width: 100%;
        }

        #name-display {
            font-size: 24px;
            font-weight: bold;
            color: #222;
            margin-bottom: 10px;
        }

        #bio-display {
            font-size: 16px;
            color: #666;
            line-height: 1.5;
            min-height: 40px;
        }

        /* 编辑区域 */
        .edit-area {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .input-field {
            padding: 12px 15px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 16px;
            outline: none;
            transition: border-color 0.3s ease;
        }

        .input-field:focus {
            border-color: #4285f4;
        }

        /* 保存按钮 */
        #save-btn {
            padding: 12px;
            background-color: #4285f4;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }

        #save-btn:hover {
            background-color: #3367d6;
        }
    </style>
</head>
<body>
    <!-- 页面标题 -->
    <h1 class="page-title">个人信息卡片</h1>

    <!-- 个人信息卡片 -->
    <div class="card">
        <!-- 头像上传区域 -->
        <div class="avatar-container">
            <img src="https://picsum.photos/200/200" alt="个人头像" class="avatar" id="avatar-preview">
            <input type="file" id="avatar-input" accept="image/*">
        </div>

        <!-- 信息展示区域 -->
        <div class="info-display">
            <h2 id="name-display">点击下方编辑姓名</h2>
            <p id="bio-display">点击下方编辑个人简介</p>
        </div>

        <!-- 编辑输入区域 -->
        <div class="edit-area">
            <input type="text" class="input-field" id="name-input" placeholder="请输入你的姓名">
            <textarea class="input-field" id="bio-input" rows="3" placeholder="请输入你的个人简介"></textarea>
            <button id="save-btn">保存修改</button>
        </div>
    </div>

    <script>
        // 获取DOM元素
        const avatarInput = document.getElementById('avatar-input');
        const avatarPreview = document.getElementById('avatar-preview');
        const nameInput = document.getElementById('name-input');
        const bioInput = document.getElementById('bio-input');
        const nameDisplay = document.getElementById('name-display');
        const bioDisplay = document.getElementById('bio-display');
        const saveBtn = document.getElementById('save-btn');

        // 1. 点击头像触发文件上传
        avatarPreview.addEventListener('click', () => {
            avatarInput.click();
        });

        // 2. 头像上传实时预览
        avatarInput.addEventListener('change', (e) => {
            // 获取选择的文件
            const file = e.target.files[0];
            if (file) {
                // 创建文件读取器
                const reader = new FileReader();
                // 读取完成后更新头像
                reader.onload = (event) => {
                    avatarPreview.src = event.target.result;
                };
                // 读取图片文件
                reader.readAsDataURL(file);
            }
        });

        // 3. 保存修改功能
        saveBtn.addEventListener('click', () => {
            // 获取输入框内容
            const newName = nameInput.value.trim();
            const newBio = bioInput.value.trim();

            // 更新展示内容（非空判断）
            if (newName) {
                nameDisplay.textContent = newName;
            }
            if (newBio) {
                bioDisplay.textContent = newBio;
            }

            // 保存后清空输入框（可选）
            nameInput.value = '';
            bioInput.value = '';

            // 提示保存成功
            alert('信息保存成功！');
        });
    </script>
</body>
</html>
